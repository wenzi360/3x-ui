name: Sync Release and Replace URLs

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动检查一次
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest release from upstream
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_REPO="MHSanaei/3x-ui"
          TARGET_REPO="wenzi360/3x-ui"

          LATEST_TAG=$(gh release view --repo $UPSTREAM_REPO --json tagName -q '.tagName')
          echo "Upstream latest tag: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to fetch upstream tag."
            exit 1
          fi

          if gh release view "$LATEST_TAG" --repo $TARGET_REPO >/dev/null 2>&1; then
            echo "Release $LATEST_TAG already exists."
            echo "should_sync=false" >> $GITHUB_OUTPUT
          else
            echo "New release $LATEST_TAG found!"
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      # 第一步：完整同步上游代码与 Tag
      - name: Sync upstream files
        if: steps.check_release.outputs.should_sync == 'true'
        env:
          TAG: ${{ steps.check_release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"

          git remote add upstream https://github.com
          git fetch upstream tag "$TAG" --no-tags

          # 同步上游该 Tag 的全部文件到本地 main 分支
          git checkout -B main "$TAG"

      # 第二步：文件同步完成后，替换指定脚本中的所有 MHSanaei/3x-ui
      - name: Replace repo URLs in install.sh, update.sh, x-ui.sh
        if: steps.check_release.outputs.should_sync == 'true'
        env:
          TAG: ${{ steps.check_release.outputs.tag }}
        run: |
          # 使用 find 全局匹配仓库内的 install.sh, update.sh, x-ui.sh（无论在根目录还是子目录）
          find . -type f \( -name "install.sh" -o -name "update.sh" -o -name "x-ui.sh" \) | while read -r file; do
            echo "Replacing URLs in: $file"
            # gI 参数表示全局替换且忽略大小写（同时覆盖 MHSanaei/3x-ui 和 mhsanaei/3x-ui）
            sed -i 's|MHSanaei/3x-ui|wenzi360/3x-ui|gI' "$file"
          done

          # 验证替换结果（检查是否还有残留）
          if grep -ri "MHSanaei/3x-ui" install.sh update.sh x-ui.sh 2>/dev/null; then
            echo "Warning: Some occurrences were not replaced!"
            exit 1
          else
            echo "All occurrences in target scripts successfully replaced with wenzi360/3x-ui."
          fi

          # 提交替换后的改动，更新 Tag 并推送到你的仓库
          git add .
          git commit -m "chore: replace MHSanaei/3x-ui with wenzi360/3x-ui in scripts for $TAG" || true
          git tag -f "$TAG"

          git push origin main --force
          git push origin "$TAG" --force

      # 第三步：同步上游 Release 附件并替换压缩包内脚本的指向地址
      - name: Sync Release assets and patch archives
        if: steps.check_release.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check_release.outputs.tag }}
        run: |
          mkdir -p release_assets
          cd release_assets

          gh release download "$TAG" --repo MHSanaei/3x-ui

          # 解压 .tar.gz 附件，同步替换里面打包的 install.sh/update.sh/x-ui.sh
          for archive in *.tar.gz; do
            if [ -f "$archive" ]; then
              mkdir -p tmp_extract
              tar -xzf "$archive" -C tmp_extract
              find tmp_extract -type f \( -name "install.sh" -o -name "update.sh" -o -name "x-ui.sh" \) -exec sed -i 's|MHSanaei/3x-ui|wenzi360/3x-ui|gI' {} +
              tar -czf "$archive" -C tmp_extract .
              rm -rf tmp_extract
            fi
          done

          gh release view "$TAG" --repo MHSanaei/3x-ui --json body -q '.body' > release_notes.md

          gh release create "$TAG" * --exclude "release_notes.md" \
            --repo wenzi360/3x-ui \
            --title "$TAG" \
            --notes-file release_notes.md
