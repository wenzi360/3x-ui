name: Sync Release and Replace URLs

on:
  schedule:
    # 每 6 小时自动运行一次（可根据需要修改 cron 表达式）
    - cron: '0 */6 * * *'
  workflow_dispatch: # 允许在 GitHub 网页端手动触发

permissions:
  contents: write # 必须赋予写权限以推送代码和创建 Release

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest release from upstream
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_REPO="MHSanaei/3x-ui"
          TARGET_REPO="wenzi360/3x-ui"

          # 获取上游最新 Release 的 Tag 名称
          LATEST_TAG=$(gh release view --repo $UPSTREAM_REPO --json tagName -q '.tagName')
          echo "Upstream latest tag: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to fetch upstream tag."
            exit 1
          fi

          # 检查当前仓库是否已经存在该 Tag 的 Release
          if gh release view "$LATEST_TAG" --repo $TARGET_REPO >/dev/null 2>&1; then
            echo "Release $LATEST_TAG already exists. Nothing to do."
            echo "should_sync=false" >> $GITHUB_OUTPUT
          else
            echo "New release $LATEST_TAG found! Starting sync..."
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Sync code, modify scripts, and push
        if: steps.check_release.outputs.should_sync == 'true'
        env:
          TAG: ${{ steps.check_release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"

          # 添加上游源并拉取最新 Tag 代码
          git remote add upstream https://github.com
          git fetch upstream tag "$TAG" --no-tags

          # 强制将 main 分支重置为上游最新 Tag 的状态（保证代码完全同步）
          git checkout -B main "$TAG"

          # 替换 install.sh, update.sh, x-ui.sh 中的仓库地址（兼容大小写）
          for file in install.sh update.sh x-ui.sh; do
            if [ -f "$file" ]; then
              sed -i 's|MHSanaei/3x-ui|wenzi360/3x-ui|gI' "$file"
              echo "Updated $file"
            fi
          done

          # 提交修改并打上同名 Tag
          git add .
          git commit -m "Sync $TAG from upstream and update repo URLs" || true
          git tag -f "$TAG"

          # 推送分支和 Tag 到你的仓库
          git push origin main --force
          git push origin "$TAG" --force

      - name: Download assets, patch inside archives, and create Release
        if: steps.check_release.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check_release.outputs.tag }}
        run: |
          mkdir -p release_assets
          cd release_assets

          # 下载上游该版本的所有 Release 附件（如 x-ui-linux-amd64.tar.gz 等）
          gh release download "$TAG" --repo MHSanaei/3x-ui

          # （可选但推荐）解压安装包并替换内部打包进去的 x-ui.sh，防止面板内执行脚本时仍指向原仓库
          for archive in *.tar.gz; do
            if [ -f "$archive" ]; then
              mkdir -p tmp_extract
              tar -xzf "$archive" -C tmp_extract
              find tmp_extract -type f \( -name "x-ui.sh" -o -name "install.sh" -o -name "update.sh" \) -exec sed -i 's|MHSanaei/3x-ui|wenzi360/3x-ui|gI' {} +
              tar -czf "$archive" -C tmp_extract .
              rm -rf tmp_extract
            fi
          done

          # 获取上游 Release 的更新日志
          gh release view "$TAG" --repo MHSanaei/3x-ui --json body -q '.body' > release_notes.md

          # 在你的仓库创建对应 Release 并上传处理后的附件
          gh release create "$TAG" * --exclude "release_notes.md" \
            --repo wenzi360/3x-ui \
            --title "$TAG" \
            --notes-file release_notes.md
