name: Sync v2.9.4 and Latest Release

on:
  schedule:
    # 每天北京时间 10:00 自动检查并同步最新正式版
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-selected:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: MHSanaei/3x-ui
      TARGET_REPO: wenzi360/3x-ui
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Sync v2.9.4 and Latest Release
        run: |
          LATEST_TAG=$(gh release view -R $UPSTREAM_REPO --json tagName -q '.tagName')
          echo "Upstream latest release: $LATEST_TAG"

          TARGET_TAGS="v2.9.4 $LATEST_TAG"

          for TAG in $TARGET_TAGS; do
            if [ -z "$TAG" ]; then
              continue
            fi

            echo "----------------------------------------"
            echo "Checking release: $TAG"

            if gh release view "$TAG" -R $TARGET_REPO >/dev/null 2>&1; then
              echo "Release $TAG already exists in $TARGET_REPO. Skipping..."
              continue
            fi

            echo "Syncing $TAG from $UPSTREAM_REPO..."
            mkdir -p ./release_assets

            gh release download "$TAG" -R $UPSTREAM_REPO -D ./release_assets
            TITLE=$(gh release view "$TAG" -R $UPSTREAM_REPO --json name -q '.name')
            NOTES=$(gh release view "$TAG" -R $UPSTREAM_REPO --json body -q '.body')

            [ -z "$TITLE" ] && TITLE="$TAG"

            gh release create "$TAG" ./release_assets/* \
              -R $TARGET_REPO \
              --title "$TITLE" \
              --notes "$NOTES"

            rm -rf ./release_assets
            echo "Successfully synced $TAG!"
          done
