name: Sync Upstream Code & Latest Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: MHSanaei/3x-ui
      TARGET_REPO: wenzi360/3x-ui
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream Code (Keep Custom Scripts)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

          git remote add upstream https://github.com
          git fetch upstream main

          git merge upstream/main -X theirs --no-edit || true
          sed -i 's|mhsanaei/3x-ui|wenzi360/3x-ui|Ig' install.sh update.sh x-ui.sh

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: sync upstream code and preserve wenzi360/3x-ui scripts"
            git push origin main
            echo "Code synced and scripts updated!"
          else
            echo "Code is already up to date."
          fi

      - name: Sync Latest Release
        run: |
          LATEST_TAG=$(gh release view -R $UPSTREAM_REPO --json tagName -q '.tagName')
          echo "Upstream latest release: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to get upstream latest release."
            exit 1
          fi

          if gh release view "$LATEST_TAG" -R $TARGET_REPO >/dev/null 2>&1; then
            echo "Release $LATEST_TAG already exists in $TARGET_REPO. Skipping..."
            exit 0
          fi

          echo "Syncing $LATEST_TAG from $UPSTREAM_REPO..."
          mkdir -p ./release_assets

          gh release download "$LATEST_TAG" -R $UPSTREAM_REPO -D ./release_assets
          TITLE=$(gh release view "$LATEST_TAG" -R $UPSTREAM_REPO --json name -q '.name')
          NOTES=$(gh release view "$LATEST_TAG" -R $UPSTREAM_REPO --json body -q '.body')

          [ -z "$TITLE" ] && TITLE="$LATEST_TAG"

          gh release create "$LATEST_TAG" ./release_assets/* \
            -R $TARGET_REPO \
            --title "$TITLE" \
            --notes "$NOTES"

          rm -rf ./release_assets
          echo "Successfully synced $LATEST_TAG!"
